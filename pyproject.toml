[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-os"
version = "0.4.0"
description = "An AI second brain to scale your marketing — files you own, driven by a deterministic CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Richard Magallanes" }]
keywords = ["marketing", "cli", "codex", "claude-code", "agent-skills", "ai-brain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

# Every URL below was checked with a live request before it was written here.
# The canonical repository is `marketing-os`; `marketing-os-next` is an old name
# that GitHub 301-redirects, so it is not used in published metadata.
[project.urls]
Homepage = "https://github.com/the-vibe-marketing-lab/marketing-os"
Repository = "https://github.com/the-vibe-marketing-lab/marketing-os"
Issues = "https://github.com/the-vibe-marketing-lab/marketing-os/issues"
Changelog = "https://github.com/the-vibe-marketing-lab/marketing-os/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
mos = "marketing_os.cli.main:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["marketing_os*"]

[tool.setuptools.package-data]
marketing_os = [
  "assets/**/*",
  "assets/business-template/.gitignore",
  "assets/business-template/.gitattributes",
  "assets/business-template/**/.gitkeep",
  "assets/business-template/.obsidian/**/*",
  "ui/static/**/*",
  "py.typed",
]
"marketing_os.ui" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90"]

# Cyclomatic complexity ceiling. Set just above the current worst function
# (`cli.dispatch`, 31) so it enforces from day one with no grandfathering and no
# suppressions. It is a regression ceiling, not the target: ratchet it down as
# hotspots are simplified. A ceiling does not stop a function below it growing
# toward it.
[tool.ruff.lint.mccabe]
max-complexity = 32
